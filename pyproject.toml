[project]
name = "sd-mia"
version = "0.1.0"
description = "Controlled membership-audit experiments for edge-cloud speculative decoding"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.6,<2",
    "bitsandbytes>=0.50.2",
    "huggingface-hub>=1.5,<3",
    "numpy>=2,<3",
    "peft>=0.15,<1",
    "pyarrow>=21,<24",
    "pydantic>=2,<3",
    "pypdf>=5.4,<7",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "safetensors>=0.5,<1",
    "speculators>=0.8,<0.9",
    "torch>=2.9,<2.14",
    "transformers>=5.0,<5.17",
    "warcio>=1.8.1",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
