[project]
name = "sd-mia"
version = "0.1.0"
description = "Controlled membership-audit experiments for edge-cloud speculative decoding"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.6,<2",
    "huggingface-hub>=0.30,<1",
    "numpy>=2,<3",
    "peft>=0.15,<1",
    "pypdf>=5.4,<7",
    "safetensors>=0.5,<1",
    "torch==2.5.1",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
