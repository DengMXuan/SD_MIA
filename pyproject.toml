[project]
name = "sd-mia"
version = "0.1.0"
description = "Controlled post-cutoff instruction-SFT dataset construction and fine-tuning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.6,<2",
    "bitsandbytes>=0.50.2",
    "huggingface-hub>=1.5,<3",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "peft>=0.15,<1",
    "requests>=2.32,<3",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "safetensors>=0.5,<1",
    "scipy>=1.14,<2",
    "speculators>=0.8,<0.9",
    "torch>=2.9,<2.14",
    "transformers>=5.0,<5.17",
    "warcio>=1.8.1",
]

[project.optional-dependencies]
dp = [
    "opacus>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
